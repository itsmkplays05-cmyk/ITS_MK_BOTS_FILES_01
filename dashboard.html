<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFK Bot Console</title>
<style>
:root{
  --bg:#f2f4f7;--panel:#fff;--line:#d9dee5;--ink:#18202c;--muted:#5d6978;--accent:#2457e6;--accent-ink:#fff;
  --ok:#0f7a58;--ok-bg:#dff3ea;--bad:#b3261e;--bad-bg:#fcebe9;--warn:#8f5700;--warn-bg:#fff2d6;
  --term:#0f1621;--term-line:#222d3c;--term-ink:#d3dae4;--term-dim:#7d8999;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1218;--panel:#151c26;--line:#263141;--ink:#e7ecf3;--muted:#92a0b2;--accent:#6c91ff;--accent-ink:#0d1218;
  --ok:#4cc79b;--ok-bg:#12332a;--bad:#ff8c82;--bad-bg:#3b1b19;--warn:#f1b84a;--warn-bg:#3a2c10;--term:#090d13;
}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:18px 14px 30px}
.wrap{max-width:1040px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.connected{color:var(--ok);background:var(--ok-bg)}
.pill.connecting{color:var(--warn);background:var(--warn-bg)}
.pill.connecting i{animation:b 1.2s infinite}
.pill.stopped,.pill.unreachable{color:var(--bad);background:var(--bad-bg)}
@keyframes b{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pill i{animation:none!important}}
.banner{display:none;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.banner.show{display:block}.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-width:0}
.m dt{font-size:12px;color:var(--muted);margin-bottom:3px}.m dd{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.m small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.main{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.term{background:var(--term);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.term-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--term-line);flex-wrap:wrap}
.term-head .grow{flex:1}.cnt{color:var(--term-dim);font-size:12px;padding-right:6px}
.chip{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--term-line);background:transparent;color:var(--term-dim);border-radius:6px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#log{height:400px;overflow-y:auto;padding:10px 14px;font:12.5px/1.65 ui-monospace,"SF Mono",Consolas,monospace;color:var(--term-ink)}
#log div{white-space:pre-wrap;overflow-wrap:anywhere}
.e{color:#ff8c82}.w{color:#f1b84a}.o{color:#5fd3a5}.c{color:#8fb0ff}.empty{color:var(--term-dim);text-align:center;padding:30px 0}
form{display:flex;border-top:1px solid var(--term-line)}
form input{flex:1;min-width:0;background:transparent;border:0;color:#e7ecf3;font:13px ui-monospace,Consolas,monospace;padding:13px 14px}
form input:focus{outline:none;background:#131b27}
form button{border:0;border-left:1px solid var(--term-line);background:transparent;color:#8fb0ff;font:inherit;font-weight:600;padding:0 20px;cursor:pointer}
form button:disabled{opacity:.5}
.side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.box h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600}
.btn{font:inherit;font-weight:600;font-size:14px;width:100%;padding:9px 12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:left}
.btn:last-child{margin-bottom:0}.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.danger{color:var(--bad)}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.toggle input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}.toggle small{display:block;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media(max-width:820px){.metrics{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}#log{height:320px}.side{order:-1}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><h1 id="title">AFK Bot Console</h1><p class="sub" id="subtitle">Loading…</p></div>
    <span class="pill connecting" id="pill"><i></i><span id="pillText">Loading</span></span>
  </header>

  <div class="banner warn" id="safeBanner">Safe mode is on. The bot stays in place and does not walk or jump. It turns on automatically after an “invalid movement” kick.</div>
  <div class="banner bad" id="errBanner">Cannot reach the bot server. Retrying…</div>

  <dl class="metrics">
    <div class="m"><dt>Online for</dt><dd id="uptime">—</dd></div>
    <div class="m"><dt>Position</dt><dd id="coords">—</dd></div>
    <div class="m"><dt>Reconnects / kicks</dt><dd><span id="recon">—</span><small id="lastKick"></small></dd></div>
    <div class="m"><dt>Server</dt><dd><span id="server">—</span><small id="version"></small></dd></div>
  </dl>

  <div class="main">
    <section class="term" aria-label="Console">
      <div class="term-head">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="err" aria-pressed="false">Errors</button>
        <button class="chip" data-f="chat" aria-pressed="false">Console</button>
        <span class="grow"></span>
        <span class="cnt" id="count">0 lines</span>
        <button class="chip" id="follow" aria-pressed="true">Follow</button>
      </div>
      <div id="log" role="log"></div>
      <form id="form" autocomplete="off">
        <input id="input" placeholder="Type a message or /help" spellcheck="false" autocapitalize="off" aria-label="Command">
        <button id="send" type="submit">Send</button>
      </form>
    </section>

    <aside class="side">
      <div class="box">
        <h2>Bot</h2>
        <button class="btn primary" id="start">Start bot</button>
        <button class="btn danger" id="stop">Stop bot</button>
      </div>
      <div class="box">
        <h2>Quick commands</h2>
        <button class="btn" data-cmd="/status">Status</button>
        <button class="btn" data-cmd="/pos">Position</button>
        <button class="btn" data-cmd="/help">Help</button>
      </div>
      <div class="box">
        <label class="toggle"><input type="checkbox" id="safe"><span>Safe mode<small>No walking or jumping. Applies on next join.</small></span></label>
      </div>
    </aside>
  </div>
</main>
<div id="toast" role="status"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var filter = "all", follow = true, history = [], hIdx = 0, lastLogs = [];

  function toast(m) {
    var t = $("toast"); t.textContent = m; t.className = "show";
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ""; }, 2600);
  }
  function api(url, body) {
    var opt = { cache: "no-store" };
    if (body !== undefined) { opt.method = "POST"; opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
    return fetch(url + (url.indexOf("?") < 0 && body === undefined ? "?t=" + Date.now() : ""), opt).then(function (r) { return r.json(); });
  }
  function fmt(s) { var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + "h " + m + "m" : m ? m + "m " + (s % 60) + "s" : s + "s"; }

  function refresh() {
    api("/health").then(function (d) {
      $("errBanner").className = "banner bad";
      var L = { connected: "Connected", connecting: "Connecting", stopped: "Stopped" };
      $("pill").className = "pill " + d.status; $("pillText").textContent = L[d.status] || d.status;
      $("title").textContent = d.name + " Console"; document.title = d.name + " Console";
      $("subtitle").textContent = d.username + " on " + d.server;
      $("uptime").textContent = d.status === "connected" ? fmt(d.uptime) : "—";
      $("coords").textContent = d.coords ? Math.floor(d.coords.x) + ", " + Math.floor(d.coords.y) + ", " + Math.floor(d.coords.z) : "—";
      $("recon").textContent = d.reconnectAttempts + " / " + d.kicks;
      $("lastKick").textContent = d.lastKick || "";
      $("server").textContent = d.server; $("version").textContent = "Minecraft " + d.version;
      $("safeBanner").className = "banner warn" + (d.safeMode ? " show" : "");
      if (document.activeElement !== $("safe")) $("safe").checked = d.safeMode;
      $("start").disabled = d.running; $("stop").disabled = !d.running;
    }).catch(function () {
      $("errBanner").className = "banner bad show";
      $("pill").className = "pill unreachable"; $("pillText").textContent = "Unreachable";
    });
  }

  function cls(l) {
    l = l.toLowerCase();
    if (/error|fail|fatal|kicked|invalid/.test(l)) return "e";
    if (/\[console\]|\[control\]/.test(l)) return "c";
    if (/warn|timeout|safe mode/.test(l)) return "w";
    if (/spawned|connected|ready|started/.test(l)) return "o";
    return "";
  }
  function render() {
    var box = $("log"), rows = lastLogs.filter(function (l) {
      var c = cls(l); return filter === "all" || (filter === "err" && c === "e") || (filter === "chat" && c === "c");
    });
    box.textContent = "";
    if (!rows.length) { var e = document.createElement("div"); e.className = "empty"; e.textContent = lastLogs.length ? "Nothing matches this filter." : "No output yet. Logs appear here once the bot starts."; box.appendChild(e); }
    rows.forEach(function (l) { var d = document.createElement("div"); d.className = cls(l); d.textContent = l; box.appendChild(d); });
    $("count").textContent = rows.length + (rows.length === 1 ? " line" : " lines");
    if (follow) box.scrollTop = box.scrollHeight;
  }
  function loadLogs() {
    return api("/api/logs").then(function (d) { lastLogs = d.logs || []; render(); }).catch(function () {});
  }

  document.querySelectorAll("[data-f]").forEach(function (b) {
    b.onclick = function () {
      filter = b.getAttribute("data-f");
      document.querySelectorAll("[data-f]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      render();
    };
  });
  $("follow").onclick = function () { follow = !follow; this.setAttribute("aria-pressed", follow); if (follow) render(); };

  function run(cmd) {
    $("send").disabled = true;
    return api("/command", { command: cmd }).then(function (r) { if (!r.success) toast(r.msg); })
      .catch(function () { toast("Command failed - server not reachable."); })
      .then(function () { $("send").disabled = false; return loadLogs(); });
  }
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("input").value.trim(); if (!v) return;
    history.push(v); hIdx = history.length; $("input").value = ""; run(v);
  });
  $("input").addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" && history.length) { e.preventDefault(); hIdx = Math.max(0, hIdx - 1); this.value = history[hIdx]; }
    if (e.key === "ArrowDown" && history.length) { e.preventDefault(); hIdx = Math.min(history.length, hIdx + 1); this.value = history[hIdx] || ""; }
  });
  document.querySelectorAll("[data-cmd]").forEach(function (b) { b.onclick = function () { run(b.getAttribute("data-cmd")); }; });

  $("start").onclick = function () { api("/start", {}).then(function (r) { toast(r.msg); refresh(); loadLogs(); }); };
  $("stop").onclick = function () { api("/stop", {}).then(function (r) { toast(r.msg); refresh(); loadLogs(); }); };
  $("safe").onchange = function () { api("/safe-mode", { enabled: this.checked }).then(function (r) { toast(r.msg); refresh(); }); };

  refresh(); loadLogs();
  setInterval(refresh, 3000); setInterval(loadLogs, 2000);
})();
</script>
</body>
</html>
